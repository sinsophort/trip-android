# Builds the Android app (APK) on GitHub — no computer setup needed.
# Secrets (repository → Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON  the text of google-services.json from Firebase (paste it as it is)
#   KEYSTORE_BASE64       your signing key (.jks) encoded with base64     (optional: without it a debug APK is made)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # the GitHub machine already has the Android SDK (ANDROID_HOME); a missing platform is downloaded by the build
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unpack android-src.zip (the app and gradle folders, uploaded as one file)
        run: |
          if [ ! -d app ] && [ -f android-src.zip ]; then unzip -q -o android-src.zip && echo "Unpacked android-src.zip"; fi
      - name: Check the files
        run: |
          for f in app/build.gradle app/src/main/AndroidManifest.xml gradlew gradle/wrapper/gradle-wrapper.jar settings.gradle gradle.properties; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f — upload android-src.zip (or the folders app and gradle) to the top of the repository"; ls -la; exit 1; fi
          done
          echo "Files OK"
      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then echo "::error::The secret GOOGLE_SERVICES_JSON is missing — Settings → Secrets and variables → Actions → New repository secret"; exit 1; fi
          # the secret can be the file's text as it is, or the same in base64
          if printf '%s' "$GS" | grep -q '^[[:space:]]*{'; then printf '%s' "$GS" > app/google-services.json; else printf '%s' "$GS" | base64 -d > app/google-services.json; fi
          python3 -c "import json; d=json.load(open('app/google-services.json')); print('Firebase project:', d['project_info']['project_id'])"
          # use the package name that was registered in Firebase (it must match, or the build stops)
          PKG=$(python3 -c "import json; d=json.load(open('app/google-services.json')); print(d['client'][0]['client_info']['android_client_info']['package_name'])")
          echo "Package name from Firebase: $PKG"
          echo "APP_ID=$PKG" >> $GITHUB_ENV
      - name: Signing key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks && echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # every build gets a higher number by itself, so phones can update the app in place (needs the same signing key)
          BASE=$(grep '^versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VNAME="$BASE.${{ github.run_number }}"; VCODE=$((1000 + ${{ github.run_number }}))
          echo "Version $VNAME (code $VCODE)"
          ARGS="--no-daemon --stacktrace -PappId=$APP_ID -PversionName=$VNAME -PversionCode=$VCODE"
          if [ -n "$KEYSTORE_FILE" ]; then ./gradlew $ARGS assembleRelease; else echo "::warning::No signing key (KEYSTORE_BASE64): a debug APK is made. Each build then has another key, and phones must uninstall before installing it (no in-app update)."; ./gradlew $ARGS assembleDebug; fi
          mkdir -p out && cp $(ls app/build/outputs/apk/*/*.apk | head -1) "out/TripExpense-$VNAME.apk"
          echo "VNAME=$VNAME" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: TripExpense-${{ env.VNAME }}
          path: out/*.apk
